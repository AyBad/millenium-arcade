<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#16161d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Millénium Arcade">
<title>Millénium Arcade</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#16161d;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:monospace}
#wrap{position:fixed;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr;grid-template-areas:"scr scr" "dpad btns"}
#scrbox{grid-area:scr;display:flex;justify-content:center;align-items:center;padding:6px;background:#0b0b10;border-bottom:4px solid #2a2a36}
#cv{image-rendering:pixelated;image-rendering:crisp-edges;background:#000;display:block;border:3px solid #3a3a48;box-shadow:0 0 0 3px #0b0b10,0 0 18px rgba(80,120,255,.25)}
#dpadbox{grid-area:dpad;display:flex;align-items:center;justify-content:center}
#btnbox{grid-area:btns;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#dpad{position:relative;width:150px;height:150px}
#dpad .a{position:absolute;background:#2c2c38;border:3px solid #4a4a5c;box-shadow:inset -3px -3px 0 #1d1d26}
#dpad .h{left:0;top:50px;width:150px;height:50px}
#dpad .v{left:50px;top:0;width:50px;height:150px}
#dpad .c{left:62px;top:62px;width:26px;height:26px;background:#1d1d26;border-radius:50%;border:none;box-shadow:none}
#dpad.u .v{border-top-color:#f8b800}#dpad.d .v{border-bottom-color:#f8b800}#dpad.l .h{border-left-color:#f8b800}#dpad.r .h{border-right-color:#f8b800}
.ab{display:flex;gap:16px;align-items:center}
.btn{width:66px;height:66px;border-radius:50%;background:#c81e1e;border:4px solid #7a0c0c;color:#ffd9d9;font:bold 20px monospace;box-shadow:inset -4px -4px 0 #8f1010;display:flex;align-items:center;justify-content:center}
.btn.on{background:#ff4a3a;transform:translateY(2px)}
#bB{margin-top:34px}
.sm{display:flex;gap:10px}
.small{padding:6px 12px;background:#3a3a48;color:#cfcfe0;border:2px solid #555569;border-radius:12px;font:bold 11px monospace;letter-spacing:1px}
.small.on{background:#f8b800;color:#000}
@media (orientation:landscape){
 #wrap{grid-template-columns:1fr auto 1fr;grid-template-rows:1fr;grid-template-areas:"dpad scr btns"}
 #scrbox{border-bottom:none;border-left:4px solid #2a2a36;border-right:4px solid #2a2a36}
}
</style>
</head>
<body>
<div id="wrap">
 <div id="scrbox"><canvas id="cv" width="256" height="240"></canvas></div>
 <div id="dpadbox"><div id="dpad"><div class="a h"></div><div class="a v"></div><div class="a c"></div></div></div>
 <div id="btnbox">
  <div class="ab"><div class="btn" id="bB">B</div><div class="btn" id="bA">A</div></div>
  <div class="sm"><div class="small" id="bMenu">MENU</div><div class="small" id="bStart">PAUSE</div><div class="small" id="bSnd">SON</div></div>
 </div>
</div>
<script>
"use strict";
// ================= MOTEUR =================
var APP_VERSION = '0.1';
const W=256,H=240;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
const C={blk:'#000000',wht:'#fcfcfc',red:'#d82800',org:'#fc7460',yel:'#f8b800',grn:'#00a800',lgr:'#b8f818',blu:'#2038ec',lbl:'#3cbcfc',pur:'#6844fc',pnk:'#f878f8',gry:'#7c7c7c',lgy:'#bcbcbc',brn:'#ac7c00',dbr:'#503000',cyn:'#00e8d8',dbl:'#0000a8',drd:'#881400',skn:'#fcbcb0',orn:'#e45c10',dgr:'#005800'};
const rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),clamp=(v,a,b)=>v<a?a:v>b?b:v;
const D=[[0,-1],[1,0],[0,1],[-1,0]]; // haut droite bas gauche
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h);}
function spr(rows,pal,x,y,flip,s){s=s||1;x=Math.round(x);y=Math.round(y);const w=rows[0].length;for(let j=0;j<rows.length;j++){const r=rows[j];for(let i=0;i<w;i++){const ch=r[i];if(ch==='.')continue;ctx.fillStyle=pal[ch];ctx.fillRect(x+(flip?w-1-i:i)*s,y+j*s,s,s);}}}
// police bitmap 3x5
const FONT={A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',F:'111100110100100',G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',M:'101111111101101',N:'110101101101101',O:'010101101101010',P:'110101110100100',Q:'010101101110011',R:'110101110101101',S:'011100010001110',T:'111010010010010',U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',Y:'101101010010010',Z:'111001010100111','0':'111101101101111','1':'010110010010111','2':'110001010100111','3':'110001010001110','4':'101101111001001','5':'111100110001110','6':'011100111101111','7':'111001010010010','8':'111101111101111','9':'111101111001110',':':'000010000010000','.':'000000000000010','!':'010010010000010','-':'000000111000000','?':'110001010000010','/':'001001010100100','>':'100010001010100','<':'001010100010001',"'":'010010000000000',',':'000000000010100','+':'000010111010000','=':'000111000111000','(':'010100100100010',')':'010001001001010','*':'000101010101000','#':'101111101111101'};
function txt(s,x,y,col,sc,al){sc=sc||1;s=String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase();const w=s.length*4*sc-sc;if(al==='c')x-=Math.floor(w/2);else if(al==='r')x-=w;x=Math.round(x);y=Math.round(y);ctx.fillStyle=col;for(let k=0;k<s.length;k++){const f=FONT[s[k]];if(!f)continue;for(let b=0;b<15;b++)if(f[b]==='1')ctx.fillRect(x+k*4*sc+(b%3)*sc,y+Math.floor(b/3)*sc,sc,sc);}}
function txtS(s,x,y,col,sc,al){txt(s,x+(sc||1),y+(sc||1),'#000',sc,al);txt(s,x,y,col,sc,al);}
const pad=(n,l)=>String(Math.max(0,Math.floor(n))).padStart(l,'0');
// stockage
const store={get(k,d){try{const v=localStorage.getItem('mla_'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('mla_'+k,JSON.stringify(v));}catch(e){}}};
// son (bips 8 bits)
let AC=null,soundOn=store.get('snd',true);
function initAudio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}
function snd(f,d,type,vol,slide){if(!AC||!soundOn)return;try{const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(vol||0.05,t);g.gain.exponentialRampToValueAtTime(0.0008,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.02);}catch(e){}}
function noise(d,vol){if(!AC||!soundOn)return;try{const n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource(),g=AC.createGain();s.buffer=b;g.gain.value=vol||0.12;s.connect(g);g.connect(AC.destination);s.start();}catch(e){}}
function jingle(notes,step){notes.forEach((f,i)=>setTimeout(()=>snd(f,step/1000*0.9,'square',0.05),i*step));}
// entrées
const K={up:0,down:0,left:0,right:0,a:0,b:0,start:0,menu:0},prevK={},latch={};
function edge(k){return (K[k]&&!prevK[k])||latch[k];}
function press(k,v){if(v&&!K[k])latch[k]=1;K[k]=v?1:0;}
const KEYMAP={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',KeyW:'up',KeyS:'down',KeyA:'left',KeyD:'right',KeyZ:'up',KeyQ:'left',Space:'a',KeyK:'a',KeyJ:'b',KeyX:'b',KeyC:'a',Enter:'start',KeyP:'start',Escape:'menu',Backspace:'menu'};
addEventListener('keydown',e=>{const k=KEYMAP[e.code];if(k){press(k,1);e.preventDefault();}initAudio();});
addEventListener('keyup',e=>{const k=KEYMAP[e.code];if(k){press(k,0);e.preventDefault();}});
let firstTouch=false;
function gesture(){initAudio();if(AC&&AC.state==='suspended')try{AC.resume();}catch(e){}
 if(!firstTouch){firstTouch=true;try{const el=document.documentElement;const r=el.requestFullscreen?el.requestFullscreen({navigationUI:'hide'}):null;if(r&&r.catch)r.catch(()=>{});}catch(e){}}}
function bindBtn(id,k,onTap){const el=document.getElementById(id);if(!el)return;
 el.addEventListener('pointerdown',e=>{e.preventDefault();gesture();try{el.setPointerCapture(e.pointerId);}catch(_){}if(k)press(k,1);el.classList.add('on');if(onTap)onTap();});
 const up=e=>{if(k)press(k,0);el.classList.remove('on');};
 el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',up);}
bindBtn('bA','a');bindBtn('bB','b');bindBtn('bStart','start');bindBtn('bMenu','menu');
bindBtn('bSnd',null,()=>{soundOn=!soundOn;store.set('snd',soundOn);updSnd();});
function updSnd(){const e=document.getElementById('bSnd');if(e)e.textContent=soundOn?'SON':'MUET';}
updSnd();
(function(){const el=document.getElementById('dpad');if(!el)return;const ids=new Set();
 function setDir(d){K.up=d===0?1:0;K.right=d===1?1:0;K.down=d===2?1:0;K.left=d===3?1:0;if(d>=0){const k=['up','right','down','left'][d];if(!prevK[k])latch[k]=1;}el.className=d<0?'':['u','r','d','l'][d];}
 function upd(e){const r=el.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);if(dx*dx+dy*dy<120){setDir(-1);return;}setDir(Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?2:0));}
 el.addEventListener('pointerdown',e=>{e.preventDefault();gesture();ids.add(e.pointerId);try{el.setPointerCapture(e.pointerId);}catch(_){}upd(e);});
 el.addEventListener('pointermove',e=>{if(ids.has(e.pointerId))upd(e);});
 const end=e=>{ids.delete(e.pointerId);if(!ids.size)setDir(-1);};
 el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);})();
cv.addEventListener('pointermove',e=>{if(!scene||!scene.drag||!(e.buttons||e.pointerType==='touch'))return;const r=cv.getBoundingClientRect();scene.drag((e.clientX-r.left)/r.width*W);});
cv.addEventListener('pointerdown',e=>{e.preventDefault();gesture();const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;if(scene&&scene.drag)scene.drag(x);if(scene&&scene.tap&&!paused)scene.tap(x,y);});
document.addEventListener('contextmenu',e=>e.preventDefault());
function fit(){const sb=document.getElementById('scrbox');if(!sb)return;const land=innerWidth>innerHeight;let aw,ah;
 if(land){ah=innerHeight-24;aw=innerWidth-2*Math.min(220,innerWidth*0.28);}else{aw=innerWidth-24;ah=innerHeight*0.6;}
 let s=Math.min(aw/W,ah/H);if(s>=2)s=Math.floor(s*2)/2;cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';}
addEventListener('resize',fit);fit();

// ================= ÉLÉMENTS COMMUNS =================
function hiGet(id){return store.get('hi_'+id,0);}
function hiSet(id,v){if(v>hiGet(id))store.set('hi_'+id,Math.floor(v));}
function popups(list){for(let i=list.length-1;i>=0;i--){const p=list[i];p.t--;p.y-=0.3;txtS(p.s,p.x,p.y,p.c||C.wht,1,'c');if(p.t<=0)list.splice(i,1);}}
function boomDraw(x,y,t,big){const r=big?Math.min(16,t):Math.min(7,t);const cols=[C.wht,C.yel,C.red];for(let k=0;k<12;k++){const a=k/12*Math.PI*2+(k%2)*0.3;const rr=r*(k%3===0?1:0.6);rect(x+Math.cos(a)*rr-1,y+Math.sin(a)*rr-1,big?3:2,big?3:2,cols[(k+t)%3]);}if(t<6)rect(x-3,y-3,6,6,C.wht);}

// ================= JEU 1 : TANK FORT =================
const ITEM_SPR={
 star:['...YY...','...YY...','YYYYYYYY','.YYYYYY.','..YYYY..','.YY..YY.','YY....YY','........'],
 helm:['..WWWW..','.WWWWWW.','WWWWWWWW','WWWWWWWW','WW....WW','WW....WW','........','........'],
 bomb:['.....RR.','....R...','..BBBB..','.BBBBBB.','.BWBBBB.','.BBBBBB.','..BBBB..','........'],
 life:['...YY...','.YYYYYY.','YYYYYYYY','YYYYYYYY','.YYYYYY.','..YYYY..','...YY...','........'],
 clock:['..WWWW..','.W..B.W.','W...B..W','W...BBBW','W......W','.W....W.','..WWWW..','........']};
const ITEMS=['star','helm','bomb','life','clock'];
function drawTank(x,y,dir,c1,c2,anim){ctx.save();ctx.translate(Math.round(x)+8,Math.round(y)+8);ctx.rotate(dir*Math.PI/2);
 const o=-8;rect(o,o,4,16,c2);rect(o+12,o,4,16,c2);
 for(let i=0;i<4;i++){const ty=o+((i*4+(anim>>1))%16);rect(o,ty,4,1,c1);rect(o+12,ty,4,1,c1);}
 rect(o+4,o+3,8,11,c1);rect(o+5,o+4,6,9,c2);rect(o+5,o+5,6,6,c1);rect(o+7,o-0,2,8,c1);rect(o+6,o+6,4,4,C.wht);rect(o+7,o+7,2,2,c1);
 ctx.restore();}
class TankGame{
 constructor(){this.id='tank';this.score=0;this.lives=3;this.level=1;this.power=0;this.newLevel();}
 newLevel(){this.genMap();this.total=Math.min(20,6+this.level*2);this.spawned=0;this.killed=0;this.tanks=[];this.bullets=[];this.fx=[];this.items=[];this.spawns=[];this.pops=[];this.spawnT=40;this.spawnIdx=1;this.freeze=0;this.state='intro';this.t=0;this.baseDead=false;this.player=null;this.spawnPlayer();}
 spawnPlayer(){this.player={x:64,y:192,dir:0,pl:true,c1:C.yel,c2:C.brn,cool:0,shield:150,anim:0,hp:1,alive:true};}
 genMap(){const g=new Uint8Array(676);this.g=g;const set=(cx,cy,v)=>{if(cx>=0&&cx<26&&cy>=0&&cy<26)g[cy*26+cx]=v;};
  for(let my=1;my<12;my++)for(let mx=0;mx<7;mx++){let v=0;const r=Math.random();
   if(mx%2===1&&my<11)v=r<0.72?1:(r<0.82?2:0);
   else if(r<0.16)v=1;else if(r<0.22)v=2;else if(r<0.3)v=4;else if(r<0.35&&my>2&&my<10&&mx!==6)v=3;
   if(!v)continue;const half=v===1&&Math.random()<0.3;
   for(const m of [mx,12-mx])for(let dy=0;dy<2;dy++)for(let dx=0;dx<2;dx++){if(half&&dy===0)continue;set(m*2+dx,my*2+dy,v);}}
  for(let cy=23;cy<26;cy++)for(let cx=11;cx<15;cx++)set(cx,cy,1);
  for(let cy=24;cy<26;cy++)for(let cx=12;cx<14;cx++)set(cx,cy,5);
  for(let cy=22;cy<26;cy++)for(let cx=8;cx<10;cx++)set(cx,cy,0);}
 allTanks(){return this.player&&this.player.alive?this.tanks.concat([this.player]):this.tanks;}
 cell(cx,cy){return this.g[cy*26+cx];}
 canMove(t,nx,ny){if(nx<0||ny<0||nx>192||ny>192)return false;
  for(let cy=ny>>3;cy<=(ny+15)>>3;cy++)for(let cx=nx>>3;cx<=(nx+15)>>3;cx++){const v=this.cell(cx,cy);if(v===1||v===2||v===3||v===5)return false;}
  for(const o of this.allTanks())if(o!==t&&Math.abs(o.x-nx)<16&&Math.abs(o.y-ny)<16&&!(Math.abs(o.x-t.x)<16&&Math.abs(o.y-t.y)<16))return false;
  for(const s of this.spawns)if(!t.pl&&false)return false;
  return true;}
 move(t,dir){if(dir!==t.dir){if((dir&1)!==(t.dir&1)){if(dir&1)t.y=Math.round(t.y/8)*8;else t.x=Math.round(t.x/8)*8;}t.dir=dir;}
  const nx=t.x+D[dir][0],ny=t.y+D[dir][1];if(this.canMove(t,nx,ny)){t.x=nx;t.y=ny;t.anim++;return true;}return false;}
 shoot(t){let n=0;for(const b of this.bullets)if(b.owner===t)n++;const max=t.pl&&this.power>=2?2:1;if(n>=max||t.cool>0)return;
  t.cool=t.pl?12:30;const spd=t.pl?(this.power>=1?4:3):(t.type===2?3:2);
  this.bullets.push({x:t.x+8+D[t.dir][0]*7,y:t.y+8+D[t.dir][1]*7,dir:t.dir,owner:t,spd,dead:false});
  if(t.pl)snd(880,0.06,'square',0.04,-500);}
 bulletStep(b){b.x+=D[b.dir][0];b.y+=D[b.dir][1];
  if(b.x<0||b.y<0||b.x>=208||b.y>=208){b.dead=true;this.fx.push({x:clamp(b.x,0,207),y:clamp(b.y,0,207),t:0,big:false});if(b.owner.pl)snd(120,0.05,'square',0.03);return;}
  const vert=(b.dir&1)===0;const core=[];
  if(vert){const cy=b.y>>3;for(let cx=(b.x-2)>>3;cx<=(b.x+1)>>3;cx++)core.push([cx,cy]);}else{const cx=b.x>>3;for(let cy=(b.y-2)>>3;cy<=(b.y+1)>>3;cy++)core.push([cx,cy]);}
  let solid=false;for(const [cx,cy] of core){if(cx<0||cy<0||cx>25||cy>25)continue;const v=this.cell(cx,cy);if(v===1||v===2||v===5)solid=true;}
  if(solid){b.dead=true;this.fx.push({x:b.x,y:b.y,t:0,big:false});
   const band=[];if(vert){const cy=b.y>>3;for(let cx=(b.x-6)>>3;cx<=(b.x+5)>>3;cx++)band.push([cx,cy]);}else{const cx=b.x>>3;for(let cy=(b.y-6)>>3;cy<=(b.y+5)>>3;cy++)band.push([cx,cy]);}
   let brk=false;for(const [cx,cy] of band){if(cx<0||cy<0||cx>25||cy>25)continue;const v=this.cell(cx,cy);
    if(v===1){this.g[cy*26+cx]=0;brk=true;}else if(v===2&&b.owner.pl&&this.power>=3){this.g[cy*26+cx]=0;brk=true;}else if(v===5)this.hitBase();}
   if(b.owner.pl)snd(brk?200:90,0.06,'square',0.04);return;}
  for(const t of this.allTanks()){if(t===b.owner||t.pl===b.owner.pl)continue;if(b.x>=t.x&&b.x<t.x+16&&b.y>=t.y&&b.y<t.y+16){b.dead=true;this.hitTank(t);return;}}}
 hitBase(){if(this.baseDead)return;this.baseDead=true;this.fx.push({x:104,y:200,t:0,big:true});noise(0.6,0.2);}
 hitTank(t){if(t.pl){if(t.shield>0)return;t.alive=false;this.fx.push({x:t.x+8,y:t.y+8,t:0,big:true});noise(0.5,0.18);this.respawnT=80;this.power=0;return;}
  if(t.bonus){t.bonus=false;this.dropItem();}
  t.hp--;if(t.hp>0){snd(300,0.05);return;}
  this.tanks.splice(this.tanks.indexOf(t),1);this.killed++;const pts=[100,200,300,400][t.type];this.score+=pts;this.pops.push({x:t.x+8,y:t.y+4,s:pts,t:40});
  this.fx.push({x:t.x+8,y:t.y+8,t:0,big:true});noise(0.35,0.15);}
 dropItem(){for(let k=0;k<30;k++){const x=ri(0,12)*16,y=ri(1,10)*16;this.items.push({x,y,type:ITEMS[ri(0,4)],t:720});snd(1200,0.1);return;}}
 pickDir(e){const r=Math.random();if(r<0.35)return 2;if(r<0.55)return e.x<96?1:3;if(r<0.7&&this.player.alive)return Math.abs(this.player.x-e.x)>Math.abs(this.player.y-e.y)?(this.player.x>e.x?1:3):(this.player.y>e.y?2:0);return ri(0,3);}
 update(){this.t++;
  if(this.state==='intro'){if(this.t>90){this.state='play';this.t=0;}return;}
  if(this.state==='over')return;
  if(this.state==='clear'){if(this.t>150){this.level++;const sc=this.score,li=this.lives,pw=this.power;this.newLevel();this.score=sc;this.lives=li;this.power=pw;}return;}
  const p=this.player;
  if(p.alive){if(p.cool>0)p.cool--;if(p.shield>0)p.shield--;
   let d=-1;if(K.up)d=0;else if(K.down)d=2;else if(K.left)d=3;else if(K.right)d=1;
   if(d>=0&&(this.t%4!==0))this.move(p,d);

class Glouton{
 constructor(){this.id='glou';this.score=0;this.lives=3;this.level=1;this.build();this.m=this.base.map(r=>r.slice());this.dots=this.totalDots;this.resetPos();}

  const seen=new Set(),st=[[10,15]];while(st.length){const [x,y]=st.pop();const k=y*21+x;if(seen.has(k))continue;const c=m[y][x];if(c==='#'||c==='G'||c==='-')continue;seen.add(k);for(const [dx,dy] of D){const ny=y+dy;if(ny<0||ny>20)continue;st.push([(x+dx+21)%21,ny]);}}

 walk(tx,ty){if(ty<0||ty>20)return false;const c=this.m[ty][(tx+21)%21];return c!=='#'&&c!=='G'&&c!=='-';}
 step(e,ghost){if(e.x%8===4&&e.y%8===4){const tx=Math.floor(e.x/8),ty=Math.floor(e.y/8);
   if(ghost)this.ghostDecide(e,tx,ty);else{if(this.walk(tx+D[e.want][0],ty+D[e.want][1]))e.dir=e.want;if(!this.walk(tx+D[e.dir][0],ty+D[e.dir][1]))return false;}}

  const dx=Math.floor(g.x/8)-ptx,dy=Math.floor(g.y/8)-pty;return dx*dx+dy*dy>64?[ptx,pty]:[0,22];}

  for(let d=0;d<4;d++){if(d===(g.dir+2)%4)continue;const nx=tx+D[d][0],ny=ty+D[d][1];if(!this.walk(nx,ny))continue;opts.push(d);const dd=(nx-tg[0])**2+(ny-tg[1])**2;if(dd<bd){bd=dd;best=d;}}

 }

function platY(i,x){const p=PLATS[i];const n=Math.max(1,(p.x1-p.x0)/16-1);const k=clamp(Math.floor((x-p.x0)/16),0,n);return Math.round(p.yl+(p.yr-p.yl)*k/n);}
function inPlat(i,x){const p=PLATS[i];return x>=p.x0&&x<p.x1;}
const WORKER=[['...HHHH.....','..HHHHHH....','..SSBSS.....','..SSSSS.....','...SSS......','..BBBBBB....','.SBBBBBBS...','.S.BBBB.S...','...BBBB.....','...JJJJ.....','..JJ..JJ....','..JJ..JJ....','.KKK..KKK...'],
 ['...HHHH.....','..HHHHHH....','..SSBSS.....','..SSSSS.....','...SSS......','..BBBBBB....','.SBBBBBBS...','.S.BBBB.S...','...BBBB.....','...JJJJ.....','...JJJJ.....','....JJ......','...KKKK.....'],
 ['..HHHHHH....','..HHHHHH....','..SSSSSS....','..SSSSSS....','S.BBBBBB.S..','SBBBBBBBBS..','..BBBBBB....','..BBBBBB....','..JJJJJJ....','..JJ..JJ....','..JJ..JJ....','..KK..KK....','............']];
const WPAL={H:C.yel,S:C.skn,B:C.lbl,J:C.dbl,K:C.dbr};
function drawGirder(i){const p=PLATS[i];for(let x=p.x0;x<p.x1;x+=16){const y=platY(i,x);rect(x,y,16,8,C.red);rect(x,y,16,1,C.org);rect(x,y+7,16,1,C.org);for(let k=0;k<4;k++){rect(x+1+k*4,y+2+(k%2)*2,2,2,C.drd);}}}
function drawBarrel(x,y,f){rect(x-5,y-8,10,8,C.brn);rect(x-4,y-9,8,1,C.brn);rect(x-4,y,8,1,C.brn);const b=f%3;rect(x-5,y-7+b*2,10,1,C.dbr);rect(x-5,y-3,10,1,C.dbr);rect(x-3+b,y-8,1,8,'#d8a038');}
function drawMegabot(x,y,arm,t){// 32x32, bas à y
 rect(x+4,y-6,8,6,C.gry);rect(x+20,y-6,8,6,C.gry);rect(x+3,y-2,10,2,C.dbr);rect(x+19,y-2,10,2,C.dbr);
 rect(x+4,y-22,24,16,C.orn);rect(x+6,y-20,20,12,C.yel);rect(x+8,y-18,4,4,C.blk);rect(x+20,y-18,4,4,C.blk);rect(x+12,y-12,8,2,C.blk);
 rect(x+8,y-31,16,10,C.lgy);rect(x+10,y-28,12,3,C.red);if((t>>3)%2)rect(x+12+((t>>4)%3)*3,y-28,3,3,C.wht);rect(x+15,y-34,2,3,C.gry);rect(x+14,y-36,4,2,C.red);
 if(arm){rect(x-2,y-32,6,14,C.orn);rect(x+28,y-32,6,14,C.orn);rect(x-3,y-35,8,4,C.gry);rect(x+27,y-35,8,4,C.gry);}
 else{rect(x-2,y-20,6,14,C.orn);rect(x+28,y-20,6,14,C.orn);rect(x-3,y-8,8,4,C.gry);rect(x+27,y-8,8,4,C.gry);}}
class Chantier{
 constructor(){this.id='chan';this.score=0;this.lives=3;this.level=1;this.pops=[];this.reset();}
 reset(){this.p={x:36,y:platY(0,36),p:0,st:'walk',vy:0,vx:0,face:1,anim:0,jy:0,lad:null};this.barrels=[];this.throwT=80;this.armT=0;this.bonus=5000;this.bonusT=0;this.state='ready';this.t=0;}
 die(){if(this.state!=='play')return;this.state='dying';this.t=0;noise(0.4,0.15);}
 update(){this.t++;const p=this.p;
  if(this.state==='ready'){if(this.t===1)jingle([262,330,392,523],120);if(this.t>80){this.state='play';this.t=0;}return;}
  if(this.state==='over')return;
  if(this.state==='dying'){if(this.t===30)for(let i=0;i<6;i++)setTimeout(()=>snd(500-i*70,0.1),i*100);if(this.t>110){this.lives--;if(this.lives<=0){this.state='over';hiSet(this.id,this.score);}else this.reset();}return;}
  if(this.state==='win'){if(this.t===1){jingle([523,659,784,1046,784,1046],100);this.score+=this.bonus;this.pops.push({x:120,y:20,s:'+'+this.bonus,t:90,c:C.yel});}if(this.t>160){this.level++;this.reset();}return;}
  this.bonusT++;if(this.bonusT>=120){this.bonusT=0;this.bonus-=100;if(this.bonus<=0){this.bonus=0;this.die();return;}}
  // joueur
  const hx=K.right?1:K.left?-1:0;if(hx)p.face=hx;
  if(p.st==='walk'){
   if(hx&&this.t%5!==0){p.x=clamp(p.x+hx,4,252);p.anim++;if(p.anim%12===0)snd(180,0.02,'square',0.02);}
   if(!inPlat(p.p,p.x)){p.st='fall';p.vy=0;p.jy=p.y;}
   else p.y=platY(p.p,p.x);
   if(p.st==='walk'){
    if(K.up){const L=LADS.find(l=>l.b===p.p&&Math.abs(l.x-p.x)<4);if(L){p.st='climb';p.lad=L;p.x=L.x;}}
    if(K.down){const L=LADS.find(l=>l.t===p.p&&Math.abs(l.x-p.x)<4);if(L){p.st='climb';p.lad=L;p.x=L.x;p.y+=1;}}
    if(edge('a')||edge('b')){p.st='jump';p.vy=-2.3;p.vx=hx*0.85;p.jy=p.y;snd(300,0.15,'square',0.04,500);}}
  }else if(p.st==='climb'){const L=p.lad,ty=platY(L.t,L.x),by=platY(L.b,L.x);
   if(K.up){p.y-=0.7;p.anim++;}else if(K.down){p.y+=0.7;p.anim++;}
   if(p.y<=ty){p.y=ty;p.p=L.t;p.st='walk';}else if(p.y>=by){p.y=by;p.p=L.b;p.st='walk';}
   if(p.p===6&&p.st==='walk'){this.state='win';this.t=0;return;}
  }else{// saut ou chute
   const oy=p.y;p.x=clamp(p.x+(p.st==='jump'?p.vx:0),4,252);p.y+=p.vy;p.vy=Math.min(3,p.vy+0.12);
   if(p.vy>0){for(let i=0;i<PLATS.length;i++){if(!inPlat(i,p.x))continue;const py=platY(i,p.x);if(oy<=py&&p.y>=py){p.y=py;p.p=i;if(p.y-p.jy>22){this.die();return;}p.st='walk';break;}}}
   if(p.y>240){this.die();return;}}
  // Mégabot
  if(this.armT>0){this.armT--;if(this.armT===0){this.barrels.push({x:48,y:platY(5,48),p:5,dir:1,st:'roll',vy:0,f:0,lad:null,scored:false});snd(150,0.1);}}
  if(--this.throwT<=0){this.armT=24;this.throwT=Math.max(55,140-this.level*14)+ri(0,40);}
  const bs=Math.min(2.2,1+this.level*0.15);
  for(const b of this.barrels){
   if(b.st==='roll'){b.x+=b.dir*bs;b.f++;
    if(!inPlat(b.p,b.x)){b.st='fall';b.vy=0;continue;}
    b.y=platY(b.p,b.x);
    if(b.p===0&&b.x<18){b.dead=true;continue;}
    for(const L of LADS){if(L.t===b.p&&Math.abs(L.x-b.x)<1.2*bs&&b.lad!==L){b.lad=L;if(Math.random()<(p.p<b.p?0.35:0.12)){b.st='lad';b.x=L.x;}break;}}
   }else if(b.st==='lad'){b.y+=1;const by=platY(b.lad.b,b.x);if(b.y>=by){b.y=by;b.p=b.lad.b;b.st='roll';const P=PLATS[b.p];b.dir=P.yl>P.yr?-1:1;}}
   else{const oy=b.y;b.y+=b.vy;b.vy+=0.18;b.x+=b.dir*0.4;
    for(let i=b.p-1;i>=0;i--){if(!inPlat(i,b.x))continue;const py=platY(i,b.x);if(oy<=py&&b.y>=py){b.y=py;b.p=i;b.st='roll';const P=PLATS[i];b.dir=P.yl>P.yr?-1:1;snd(90,0.05);break;}}
    if(b.y>250)b.dead=true;}
   // collisions
   const pc=p.y-6,bc=b.y-4;
   if(Math.abs(b.x-p.x)<7&&Math.abs(bc-pc)<9){this.die();return;}
   if(p.st==='jump'&&!b.scored&&Math.abs(b.x-p.x)<5&&b.y>p.y&&b.y-p.y<30){b.scored=true;this.score+=100;this.pops.push({x:p.x,y:p.y-18,s:100,t:40});snd(1000,0.08);}
  }
  this.barrels=this.barrels.filter(b=>!b.dead);
 }
 draw(){rect(0,0,W,H,C.blk);
  for(const L of LADS){const ty=platY(L.t,L.x),by=platY(L.b,L.x);rect(L.x-5,ty,1,by-ty,C.cyn);rect(L.x+4,ty,1,by-ty,C.cyn);for(let y=ty+3;y<by;y+=4)rect(L.x-5,y,10,1,C.cyn);}
  for(let i=0;i<PLATS.length;i++)drawGirder(i);
  // bidon de feu
  const dy=platY(0,8);rect(4,dy-16,16,16,C.blu);rect(4,dy-12,16,2,C.lbl);rect(4,dy-5,16,2,C.lbl);txt('OIL',6,dy-9,C.wht);
  const fl=(this.t>>2)%3;rect(6+fl,dy-21,4,5,C.yel);rect(12-fl,dy-23,4,7,C.red);rect(9,dy-19,6,3,C.org);
  // pile de tonneaux
  for(let k=0;k<2;k++){drawBarrel(6+5,48-k*0+0,0);}rect(2,30,8,24,C.brn);rect(2,34,8,1,C.dbr);rect(2,44,8,1,C.dbr);
  drawMegabot(16,54,this.armT>0,this.t);
  // ami en haut
  const fy=26;spr(['..PPPP..','.PPPPPP.','.SSSSSS.','.SBSSBS.','..SSSS..','.PPPPPP.','PPPPPPPP','.PPPPPP.','.PP..PP.','.SS..SS.'],{P:C.pnk,S:C.skn,B:C.blk},104,fy-10);
  if((this.t>>4)%2&&this.state==='play')txtS('AIDE!',116,fy-18,C.wht,1);
  rect(140,fy-24,1,24,C.lgy);rect(141,fy-24,8,5,C.lgr);
  for(const b of this.barrels)drawBarrel(b.x,b.y,b.f>>2);
  const p=this.p;let f=p.st==='climb'?2:(p.st==='walk'&&(p.anim>>2)%2?1:0);
  if(this.state==='dying'&&this.t>30){const a=(this.t>>3)%4;ctx.save();ctx.translate(Math.round(p.x),Math.round(p.y-6));ctx.rotate(a*Math.PI/2);spr(WORKER[0],WPAL,-6,-7);ctx.restore();}
  else spr(WORKER[f],WPAL,p.x-(p.face<0?6:5),p.y-13,p.face<0&&f!==2);
  popups(this.pops);
  txt('SCORE',8,4,C.wht);txt(pad(this.score,6),30,4,C.yel);txt('HI',100,4,C.wht);txt(pad(Math.max(hiGet(this.id),this.score),6),110,4,C.yel);
  rect(196,2,56,16,C.dbl);rect(197,3,54,14,C.blk);txt('BONUS',200,5,C.cyn);txt(pad(this.bonus,4),232,11,C.yel);
  txt('VIES '+this.lives,196,22,C.wht);txt('NIV '+this.level,170,4,C.wht);
  if(this.state==='ready'){rect(64,104,128,24,C.blk);txtS('GRIMPE EN HAUT !',128,112,C.yel,1,'c');}
  if(this.state==='win')txtS('BRAVO !',128,110,C.lgr,2,'c');
 }
}

class Cirque{
 constructor(){this.id='cirq';this.score=0;this.lives=3;this.level=1;this.pops=[];this.newStage();}
 newStage(){this.L=2000;this.G=196;this.wx=16;this.y=this.G;this.vy=0;this.air=false;this.vx=0;this.anim=0;this.rings=[];this.ringT=60;this.cp=0;
  this.pots=[];let x=260;while(x<this.L-120){if(x%200>60&&x%200<170)this.pots.push({x,passed:false});x+=ri(150,260)-this.level*10;}
  this.bonus=5000;this.bonusT=0;this.state='ready';this.t=0;this.cam=0;}
 die(){if(this.state!=='play')return;this.state='dying';this.t=0;noise(0.4,0.15);}
 respawn(){this.cp=Math.max(0,Math.floor(this.wx/200)*200);this.wx=this.cp+16;this.y=this.G;this.air=false;this.vy=0;this.rings=[];this.ringT=60;}
 update(){this.t++;
  if(this.state==='ready'){if(this.t===1)jingle([392,494,587,784,587,784],110);if(this.t>90){this.state='play';this.t=0;}return;}
  if(this.state==='over')return;
  if(this.state==='dying'){if(this.t===20)for(let i=0;i<6;i++)setTimeout(()=>snd(450-i*60,0.1),i*100);if(this.t>100){this.lives--;if(this.lives<=0){this.state='over';hiSet(this.id,this.score);}else{this.respawn();this.state='play';this.t=0;}}return;}
  if(this.state==='win'){if(this.t===1){this.score+=this.bonus;this.pops.push({x:128,y:90,s:'+'+this.bonus,t:90,c:C.yel});jingle([523,659,784,1046,880,1046],110);}if(this.t>170){this.level++;this.newStage();}return;}
  this.bonusT++;if(this.bonusT>=30){this.bonusT=0;this.bonus=Math.max(0,this.bonus-10);}
  if(!this.air){this.vx=K.right?1.6:K.left?-0.8:0;if(this.vx)this.anim++;
   if(edge('a')||edge('b')||edge('up')){this.air=true;this.vy=-3.6;snd(260,0.2,'square',0.04,500);}}
  this.wx=clamp(this.wx+this.vx,this.cp,this.L);
  if(this.air){this.y+=this.vy;this.vy+=0.16;if(this.y>=this.G){this.y=this.G;this.air=false;this.vy=0;}}
  this.cam=Math.max(0,Math.min(this.wx-70,this.L+64-W));
  // anneaux
  const rs=0.6+this.level*0.12;
  if(--this.ringT<=0){const rx=this.cam+W+20;const meet=this.wx+30+1.6*(rx-this.wx-30)/(1.6+rs);if(rx<this.L-40&&!this.pots.some(p=>Math.abs(p.x+7-rx)<50||Math.abs(p.x+7-meet)<80)){this.rings.push({x:rx,passed:false,big:Math.random()<0.25});this.ringT=ri(110,190)-this.level*8;}else this.ringT=15;}
  for(const r of this.rings)r.x-=rs;this.rings=this.rings.filter(r=>r.x>this.cam-40);
  const lb={x0:this.wx+3,x1:this.wx+30,y0:this.y-14,y1:this.y},cb={x0:this.wx+9,x1:this.wx+18,y0:this.y-37,y1:this.y-14};
  const ov=(b,x0,x1,y0,y1)=>b.x0<x1&&b.x1>x0&&b.y0<y1&&b.y1>y0;
  for(const p of this.pots){if(ov(lb,p.x+3,p.x+11,this.G-12,this.G)){this.die();return;}if(!p.passed&&p.x+14<this.wx){p.passed=true;this.score+=200;this.pops.push({x:p.x-this.cam+7,y:this.G-30,s:200,t:40});snd(1000,0.08);}}
  const RT=this.G-108,RB=this.G-24;
  for(const r of this.rings){const x0=r.x-3,x1=r.x+3;
   if(ov(lb,x0,x1,RB-2,RB+3)||ov(cb,x0,x1,RT-4,RT+2)||ov(lb,x0,x1,RT-4,RT+2)){this.die();return;}
   if(!r.passed&&r.x<this.wx+6){r.passed=true;const pts=r.big?500:100;this.score+=pts;this.pops.push({x:r.x-this.cam,y:RT-6,s:pts,t:40});snd(r.big?1300:900,0.1);}}
  if(this.wx>=this.L-8&&!this.air){this.state='win';this.t=0;}
 }
 draw(){const cam=Math.floor(this.cam),G=this.G;

  const RT=G-108,RB=G-24,mid=(RT+RB)/2,rh=(RB-RT)/2;
  const ringHalf=(r,front)=>{const sx=r.x-cam;for(let k=0;k<48;k++){const a=k/48*Math.PI*2;const c=Math.cos(a);if(front?c<0:c>=0)continue;const xx=sx+Math.sin(a)*0+c*5,yy=mid+Math.sin(a)*rh;rect(xx-1,yy-1,3,3,((k+(this.t>>2))%4<2)?C.yel:C.orn);}
   if(!front&&r.big){rect(sx-4,RT-10,8,8,C.brn);rect(sx-2,RT-12,4,2,C.brn);txt('$',sx-1,RT-8,C.yel);}
   if(front&&(this.t>>2)%2)rect(sx-1,RT-4,2,3,C.red);};
  for(const r of this.rings)ringHalf(r,false);
  for(const p of this.pots){const sx=p.x-cam;if(sx<-20||sx>W)continue;rect(sx+1,G-10,12,10,C.brn);rect(sx,G-10,14,2,C.dbr);rect(sx+3,G-6,8,2,C.yel);const f=(this.t>>2)%2;rect(sx+3+f,G-16,4,6,C.red);rect(sx+7-f,G-18,4,8,C.orn);rect(sx+5,G-14,4,4,C.yel);}
  const x=this.wx-cam;const blink=this.state==='dying'&&(this.t>>2)%2;
  if(!blink){drawLion(x,this.y,(this.anim>>3)%2,this.state==='dying');drawClown(x,this.y-6,this.air||this.state==='win'?1:0);}

  txt(pad(Math.max(0,Math.ceil((this.L-this.wx)/20)),3)+'M',250,8,C.lgr,1,'r');

   if(k<0||this.slots[k]){this.die('wall');return;}
   this.slots[k]=true;const pts=50+Math.floor(this.timer/60)*10;this.score+=pts;this.pops.push({x:k*48+24,y:30,s:pts,t:50,c:C.yel});jingle([784,988,1175],70);
   if(this.slots.every(s=>s)){this.score+=1000;this.state='clear';this.t=0;jingle([523,659,784,1046,784,1046],100);}else this.resetHero();return;}
  if(l&&this.hr<=5){if(this.hopT>0)return;if(!this.under(l,cx)){this.die('eau');return;}this.hx+=l.dir*l.spd;if(this.hx<-6||this.hx>246){this.die('bord');return;}}
  else if(l){for(const o of l.objs)if(this.hx+3<o.x+l.w&&this.hx+13>o.x){this.die('route');return;}}}
 drawVehicle(l,x,y){const w=l.w;
  if(l.kind==='truck'){rect(x,y+3,w,10,C.lgy);rect(x+(l.dir<0?0:w-9),y+2,9,12,C.red);rect(x+(l.dir<0?2:w-7),y+4,4,8,C.lbl);for(const wx of [4,14,24])rect(x+wx,y+12,4,3,C.blk);}
  else if(l.kind==='dozer'){rect(x+2,y+3,12,9,C.yel);rect(x+(l.dir>0?13:0),y+2,3,12,C.gry);rect(x+5,y+5,5,4,C.blk);rect(x+2,y+12,12,3,C.dbr);}
  else{rect(x+1,y+4,14,8,l.col);rect(x+4,y+2,8,12,l.col);rect(x+5,y+3,6,3,C.lbl);rect(x+5,y+10,6,3,C.lbl);rect(x,y+2,3,2,C.blk);rect(x+13,y+2,3,2,C.blk);rect(x,y+12,3,2,C.blk);rect(x+13,y+12,3,2,C.blk);}}
 draw(){const oy=24,t=this.t;rect(0,0,W,H,C.blk);
  // eau
  rect(0,oy+16,W,80,'#0028a0');for(let r=1;r<=5;r++)for(let x=((t>>3)+r*5)%16-16;x<W;x+=16)rect(x+4,oy+r*16+7,4,1,'#3c64e0');
  // arrivée
  rect(0,oy,W,16,C.dgr);for(let x=0;x<W;x+=8)rect(x+2,oy+2,4,4,C.grn);
  [1,4,7,10,13].forEach((c,k)=>{rect(c*16-2,oy+2,20,14,'#0028a0');if(this.slots[k])spr(CHICK,{Y:C.yel,B:C.blk,O:C.orn},c*16+2,oy+3);});
  // terre-plein et départ
  rect(0,oy+96,W,16,C.pur);for(let x=0;x<W;x+=8)rect(x+((x>>3)%2)*4,oy+100,2,2,'#9c7cfc');
  rect(0,oy+112,W,80,'#303030');for(let r=8;r<=11;r++)for(let x=0;x<W;x+=24)rect(x,oy+r*16-1,12,2,'#a0a0a0');
  rect(0,oy+192,W,16,C.pur);for(let x=0;x<W;x+=8)rect(x+((x>>3)%2)*4,oy+197,2,2,'#9c7cfc');
  for(const l of this.lanes){const y=oy+l.row*16;for(const o of l.objs){const x=Math.round(o.x);
   if(l.kind==='log'){rect(x,y+3,l.w,10,C.brn);rect(x,y+3,l.w,2,'#d8a038');for(let k=6;k<l.w-4;k+=10)rect(x+k,y+7,5,1,C.dbr);rect(x,y+3,2,10,C.dbr);rect(x+l.w-2,y+3,2,10,'#d8a038');}
   else if(l.kind==='pad'){for(let k=0;k<l.len;k++){const px=x+k*16;rect(px+2,y+3,12,10,C.grn);rect(px+1,y+5,14,6,C.grn);rect(px+7,y+3,2,5,'#0028a0');rect(px+4,y+5,3,2,C.lgr);}}
   else this.drawVehicle(l,x,y);}}
  // héros
  if(!(this.state==='dying'&&(t>>2)%2)){const hx=Math.round(this.hx),hy=oy+this.hr*16+2-(this.hopT>0?3:0);
   if(this.state==='dying'&&t>20){if(this.why==='eau'||this.why==='bord'){const r=Math.min(8,(t-20)>>2);rect(hx+8-r,hy+6,r*2,2,C.wht);rect(hx+7,hy+6-r,2,r*2,C.lbl);}else{rect(hx+1,hy+5,14,4,C.yel);rect(hx+5,hy+3,6,8,C.yel);rect(hx+6,hy+5,1,1,C.blk);rect(hx+9,hy+5,1,1,C.blk);}}
   else{ctx.save();ctx.translate(hx+8,hy+6);ctx.rotate([0,Math.PI/2,Math.PI,-Math.PI/2][this.hdir]);spr(CHICK,{Y:C.yel,B:C.blk,O:C.orn},-6,-6);ctx.restore();}}
  popups(this.pops);
  rect(0,0,W,24,C.blk);txt('SCORE',6,4,C.wht);txt(pad(this.score,6),6,12,C.yel);txt('HI',60,4,C.wht);txt(pad(Math.max(hiGet(this.id),this.score),6),60,12,C.yel);txtS('TRAVERSEE',152,4,C.yel,1,'c');txt('NIV '+this.level,152,13,C.wht,1,'c');
  for(let i=0;i<this.lives-1;i++)spr(CHICK,{Y:C.yel,B:C.blk,O:C.orn},206+i*14,6);
  rect(0,232,W,8,C.blk);txt('TEMPS',4,233,C.wht);const tw=Math.max(0,Math.floor(this.timer/(60*45)*200));rect(52,233,tw,5,this.timer<600?C.red:C.lgr);
  if(this.state==='ready')txtS('NIVEAU '+this.level,128,oy+98,C.wht,2,'c');
  if(this.state==='clear')txtS('BRAVO !',128,oy+98,C.lgr,2,'c');}
}

// ================= MENU =================
const GAMES=[
 {id:'tank',name:'TANK FORT',sub:'BLINDES',col:C.yel,make:()=>new TankGame(),icon:(x,y,t)=>{drawTank(x-20,y-8,1,C.yel,C.brn,t);drawTank(x+4,y-8,3,C.lgy,C.gry,t);if((t>>3)%2)rect(x-2,y-1,3,3,C.wht);}},
 {id:'glou',name:'GLOUTON',sub:'LABYRINTHE',col:C.org,make:()=>new Glouton(),icon:(x,y,t)=>{drawHero(x-14,y,1,(t>>3)%2,C.org);for(let i=0;i<3;i++)rect(x-4+i*6,y-1,2,2,C.skn);spr((t>>3)%2?BOT_A:BOT_B,{C:C.red,D:'#2a2a2a',W:C.wht,B:C.blk,G:C.lgy},x+12,y-5,true);}},
 {id:'chan',name:'HAUT CHANTIER',sub:'PLATEFORMES',col:C.red,make:()=>new Chantier(),icon:(x,y,t)=>{rect(x-26,y+6,52,6,C.red);rect(x-26,y+6,52,1,C.org);drawBarrel(x+10-((t>>1)%20),y+6,t>>2);spr(WORKER[(t>>3)%2],WPAL,x-22,y-7);}},
 {id:'brik',name:'CASSE-BRIQUES',sub:'RAQUETTE',col:C.cyn,make:()=>new Casse(),icon:(x,y,t)=>{for(let r=0;r<3;r++)for(let c=0;c<5;c++)if(!(r===2&&c===(t>>5)%5))rect(x-24+c*10,y-14+r*6,9,5,BRICK_COLS[r*2]);const bx=x-14+Math.abs(((t)%56)-28),by=y+2-Math.abs(((t>>1)%16)-8);rect(bx,by,3,3,C.wht);rect(x-8,y+12,16,3,C.lgy);}},
 {id:'inv',name:'ENVAHISSEURS',sub:'TIR SPATIAL',col:C.lgr,make:()=>new Envahisseurs(),icon:(x,y,t)=>{for(let i=0;i<3;i++)spr(ALIENS[i][(t>>4)%2],{A:[C.pnk,C.cyn,C.lgr][i],W:C.wht,B:C.blk},x-22+i*16,y-14);spr(SHIP,{W:C.wht,C:C.lbl,R:C.red},x-6,y+6);if((t>>3)%2)rect(x,y-2,1,5,C.wht);}},
 {id:'trav',name:'TRAVERSEE',sub:'ROUTE ET RIVIERE',col:C.yel,make:()=>new Traversee(),icon:(x,y,t)=>{rect(x-26,y-18,52,12,'#0028a0');rect(x-26+((t>>1)%60)-10,y-15,24,7,C.brn);rect(x-26,y-6,52,14,'#303030');rect(x+18-((t)%64),y-3,14,8,C.pnk);spr(CHICK,{Y:C.yel,B:C.blk,O:C.orn},x-6,y+6);}},
 {id:'cirq',name:'CIRQUE PIXEL',sub:'ACROBATIES',col:C.pnk,make:()=>new Cirque(),icon:(x,y,t)=>{const j=Math.abs(Math.sin(t/14))*6;drawLion(x-22,y+12-j,(t>>3)%2);drawClown(x-22,y+6-j,0);for(let k=0;k<20;k++){const a=k/20*Math.PI*2;rect(x+14+Math.cos(a)*3,y-2+Math.sin(a)*12,2,2,k%2?C.yel:C.orn);}}}
];
class Menu{
 constructor(sel){this.sel=sel||store.get('lastSel',0);this.t=0;this.stars=[];for(let i=0;i<50;i++)this.stars.push({x:rnd(0,W),y:rnd(0,H),s:rnd(0.2,1)});}
 card(i){return {x:i%2?130:6,y:46+Math.floor(i/2)*45,w:120,h:42};}
 tap(x,y){for(let i=0;i<GAMES.length;i++){const c=this.card(i);if(x>=c.x&&x<c.x+c.w&&y>=c.y&&y<c.y+c.h){this.sel=i;this.launch();return;}}}
 launch(){store.set('lastSel',this.sel);jingle([523,784,1046],70);go(GAMES[this.sel].make());}
 update(){this.t++;for(const s of this.stars){s.y+=s.s;if(s.y>H){s.y=0;s.x=rnd(0,W);}}
  const n=GAMES.length;if(edge('left')||edge('right')){const j=this.sel^1;if(j<n)this.sel=j;snd(660,0.05);}if(edge('up')){this.sel=(this.sel-2+8)%8;if(this.sel>=n)this.sel-=2;snd(660,0.05);}if(edge('down')){this.sel=(this.sel+2)%8;if(this.sel>=n)this.sel=this.sel%2;snd(660,0.05);}
  if(edge('a')||edge('start'))this.launch();}
 draw(){rect(0,0,W,H,'#08081a');for(const s of this.stars)rect(s.x,s.y,1,1,s.s>0.7?C.wht:C.gry);
  const t=this.t;const cols=[C.red,C.org,C.yel,C.lgr,C.lbl,C.pnk];const title='MILLENIUM';
  for(let i=0;i<title.length;i++){const yy=8+Math.round(Math.sin(t/12+i*0.6)*2);txt(title[i],128-((title.length*12-3)>>1)+i*12+1,yy+1,'#000',3);txt(title[i],128-((title.length*12-3)>>1)+i*12,yy,cols[(i+(t>>4))%6],3);}
  txtS('A R C A D E',128,28,C.wht,2,'c');rect(40,41,176,1,C.pur);
  for(let i=0;i<GAMES.length;i++){const c=this.card(i),g=GAMES[i],on=i===this.sel;
   rect(c.x,c.y,c.w,c.h,on&&(t>>3)%2?g.col:'#3a3a52');rect(c.x+2,c.y+2,c.w-4,c.h-4,'#10102a');
   ctx.save();ctx.beginPath();ctx.rect(c.x+3,c.y+3,56,c.h-6);ctx.clip();rect(c.x+3,c.y+3,56,c.h-6,'#000');ctx.translate(c.x+31,c.y+21);ctx.scale(0.75,0.75);g.icon(0,0,on?t:0);ctx.restore();
   const tx=c.x+62;txt(g.name,tx,c.y+8,on?g.col:C.wht);
   txt(g.sub.length>13?g.sub.split(' ')[0]:g.sub,tx,c.y+18,C.gry);txt('HI',tx,c.y+32,C.yel);txt(pad(hiGet(g.id),6),tx+10,c.y+32,C.yel);}
  if((t>>4)%2)txtS('TOUCHE UN JEU OU APPUIE SUR A',128,228,C.wht,1,'c');
  txt('V'+APP_VERSION,4,234,'#44446a');txt('SYPHAX APPS',252,234,'#44446a',1,'r');}
}

// ================= BOUCLE =================
let scene=null,paused=false;
function go(s){scene=s;paused=false;}
function overlayOver(g){rect(48,84,160,72,C.blk);rect(49,85,158,70,C.red);rect(51,87,154,66,C.blk);
 txtS('GAME OVER',128,94,C.red,2,'c');txt('SCORE '+pad(g.score,6),128,114,C.wht,1,'c');
 if(g.score>=hiGet(g.id)&&g.score>0)txt('NOUVEAU RECORD !',128,124,C.yel,1,'c');
 txt('A : REJOUER',128,134,C.lgr,1,'c');txt('B : MENU',128,143,C.lbl,1,'c');}
function tick(){
 if(edge('menu')&&!(scene instanceof Menu)){go(new Menu(GAMES.findIndex(g=>g.id===scene.id)));}
 else if(scene instanceof Menu){scene.update();}
 else{
  if(scene.state==='over'){scene.overT=(scene.overT||0)+1;if(scene.overT>40){if(edge('a')){const gi=GAMES.findIndex(g=>g.id===scene.id);go(GAMES[gi].make());}else if(edge('b')||edge('start'))go(new Menu(GAMES.findIndex(g=>g.id===scene.id)));}}
  else if(paused){if(edge('start')||edge('a'))paused=false;else if(edge('b'))go(new Menu(GAMES.findIndex(g=>g.id===scene.id)));}
  else{if(edge('start'))paused=true;else scene.update();}
 }
 for(const k in K)prevK[k]=K[k];for(const k in latch)delete latch[k];
}
function render(){scene.draw();if(!(scene instanceof Menu)){if(scene.state==='over')overlayOver(scene);else if(paused){rect(64,96,128,48,C.blk);rect(65,97,126,46,C.lbl);rect(67,99,122,42,C.blk);txtS('PAUSE',128,104,C.lbl,2,'c');txt('A : REPRENDRE',128,122,C.wht,1,'c');txt('B : MENU',128,131,C.wht,1,'c');}}}
let last=0,acc=0;
function frame(ts){if(!last)last=ts;acc+=Math.min(100,ts-last);last=ts;let n=0;while(acc>=1000/60&&n<4){tick();acc-=1000/60;n++;}if(n)render();requestAnimationFrame(frame);}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&scene&&!(scene instanceof Menu)&&scene.state!=='over')paused=true;});
go(new Menu());render();requestAnimationFrame(frame);
try{if('serviceWorker' in navigator&&location.protocol==='https:'&&!window.Capacitor)navigator.serviceWorker.register('sw.js');}catch(e){}
</script>
