name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les dépendances
        run: npm install

      - name: Créer le projet Android
        run: npx cap add android

      - name: Icône et écran de lancement
        run: |
          cp -r resources/res/. android/app/src/main/res/
          find android/app/src/main/res -name 'splash.png' -exec cp resources/splash.png {} \;

      - name: Plein écran (masquer les barres système)
        run: |
          f=$(find android/app/src/main/java -name MainActivity.java)
          pkg=$(grep -m1 '^package' "$f")
          cat > "$f" <<EOF
          $pkg

          import android.os.Bundle;
          import android.view.WindowManager;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().getDecorView().setBackgroundColor(0xFF16161D);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  hideSystemBars();
              }

              @Override
              public void onResume() {
                  super.onResume();
                  hideSystemBars();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideSystemBars();
              }

              private void hideSystemBars() {
                  WindowInsetsControllerCompat c = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                  c.hide(WindowInsetsCompat.Type.systemBars());
                  c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
              }
          }
          EOF
          cat "$f"

      - name: Version et signature fixe (mise à jour sans désinstaller)
        run: |
          VER=$(grep -oP "APP_VERSION = '\K[0-9.]+" www/index.html)
          echo "APP_VERSION=$VER" >> $GITHUB_ENV
          G=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$VER\"/" $G
          cat >> $G <<'EOF'

          android {
              signingConfigs {
                  debug {
                      storeFile file('../../debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          }
          EOF
          grep -E "versionCode|versionName|debug.keystore" $G

      - name: Déclarer l'application comme un jeu
        run: sed -i 's/<application/<application android:appCategory="game" android:isGame="true"/' android/app/src/main/AndroidManifest.xml

      - name: Publicité AdMob (identifiant d'application)
        run: |
          # Identifiant de TEST Google : à remplacer par l'identifiant du compte AdMob avant publication
          ADMOB_APP_ID="ca-app-pub-3940256099942544~3347511713"
          sed -i "s|</application>|    <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$ADMOB_APP_ID\"/>\n    </application>|" android/app/src/main/AndroidManifest.xml
          grep -q "gms.ads.APPLICATION_ID" android/app/src/main/AndroidManifest.xml

      - name: Copier le jeu
        run: npx cap sync android

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -i 'SHA-256'

      - uses: actions/upload-artifact@v4
        with:
          name: millenium-arcade-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publier l'APK (lien de téléchargement fixe)
        if: github.ref_name != 'test'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "millenium-arcade-v$APP_VERSION.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk millenium-arcade.apk
          TAG="v$APP_VERSION"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "millenium-arcade-v$APP_VERSION.apk" millenium-arcade.apk \
            --target "${{ github.sha }}" --latest \
            --title "Millénium Arcade V$APP_VERSION ($(TZ=Europe/Paris date '+%d/%m/%Y %H:%M'))" \
            --notes "$(git log -1 --pretty=%B | sed '/^Co-Authored-By/d;/^Claude-Session/d')"
          # garder les 10 dernières versions
          gh release list --limit 100 --json tagName,createdAt -q '[.[] | select(.tagName != "test")] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' |
            while read -r t; do gh release delete "$t" --yes --cleanup-tag; done
