name: Version iPhone (web installable)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Préparer le site
        run: |
          VER=$(grep -oP "APP_VERSION = '\K[0-9.]+" www/index.html)
          mkdir out
          cp -r www/. out/
          sed -i "s/var CACHE = 'ma-v1';/var CACHE = 'ma-$VER-${{ github.run_number }}';/" out/sw.js
          grep -q "ma-$VER" out/sw.js

      - name: Publier sur la branche gh-pages
        run: |
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          cd out
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Site depuis ${{ github.sha }}"
          git push -q -f "$URL" gh-pages

      - name: Activer GitHub Pages (première fois)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1 || \
            gh api -X POST "repos/${{ github.repository }}/pages" -f "source[branch]=gh-pages" -f "source[path]=/" || \
            echo "::warning::Activer Pages manuellement : Settings > Pages > branche gh-pages"
